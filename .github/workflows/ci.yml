name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: devrecall
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: devrecall_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U devrecall -d devrecall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:8.0
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://devrecall:ci_only@127.0.0.1:5432/devrecall_test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      REQUIRE_DB_TESTS: '1'
      AI_PROVIDER: ''
      AI_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - run: pip install --no-deps -e backend
      - run: python -m pytest backend/tests -q
  frontend-and-legacy-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:legacy
      - run: npm run build
