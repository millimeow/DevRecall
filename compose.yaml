# Disposable/local development defaults only. Bind databases to loopback.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: devrecall
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: devrecall
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrecall -d devrecall"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  mongo_data:
